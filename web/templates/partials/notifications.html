{{if .Notifications}}
<div class="px-3 py-2 border-b">
  <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Notifikasi</p>
</div>
{{range .Notifications}}
<div class="flex items-start gap-3 px-3 py-3 hover:bg-gray-50 border-b last:border-0">
  <div class="w-2 h-2 rounded-full mt-1.5 flex-shrink-0" style="background:#568C20"></div>
  <div class="flex-1 min-w-0">
    <p class="text-sm text-gray-700">{{.Message}}</p>
    <p class="text-xs text-gray-400 mt-0.5">{{formatDateTime .CreatedAt}}</p>
  </div>
</div>
{{end}}
{{else}}
<div class="text-center py-8 text-gray-400">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 mx-auto mb-2 opacity-40">
    <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
  </svg>
  <p class="text-sm">Tidak ada notifikasi baru</p>
</div>
{{end}}
