{{define "content"}}
<div class="p-4 md:p-6 max-w-7xl mx-auto space-y-5">

  <form action="/non-inventory/permintaan/submit" method="POST" enctype="multipart/form-data"
        x-data="niForm()" @submit.prevent="handleSubmit">

              <div class="flex items-center gap-2 mb-2">
          <a href="/non-inventory/permintaan" class="btn btn-xs btn-ghost">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3 h-3">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
            </svg>
            Kembali
          </a>
        </div>

    <!-- Info Umum -->
    <div class="card bg-base-100 shadow-sm mb-4">
      <div class="card-body">
        <h3 class="font-semibold text-gray-700 mb-3 flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          Informasi Pemohon
        </h3>
        <div class="grid grid-cols-1 md:grid-cols-1 gap-2">

          <!-- No. BPJT -->
          <div class="form-control md:col-span-2">
            <label class="label"><span class="label-text font-medium">No. BPJT</span></label>
            <div class="flex items-center gap-3">
              <div class="input input-bordered input-sm bg-base-200 flex items-center gap-2 w-56 cursor-not-allowed">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-4 h-4 flex-shrink-0 text-gray-400">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 8.25h15m-16.5 7.5h15m-1.8-13.5-3.9 19.5m-2.1-19.5-3.9 19.5" />
                </svg>
                <span class="font-mono font-semibold text-gray-700 tracking-wide">{{.NoBPJT}}</span>
              </div>
            </div>
            <input type="hidden" name="no_bpjt" value="{{.NoBPJT}}"/>
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Nama Pemohon <span class="text-error">*</span></span></label>
            <input type="text" name="nama_pemohon" class="input input-bordered input-sm" required
                   placeholder="Masukkan nama lengkap"/>
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Seksi / Divisi <span class="text-error">*</span></span></label>
            <select name="seksi_divisi" class="select select-bordered select-sm" required>
              <option value="" disabled selected>Pilih Seksi</option>
              <option value="MTC1">MTC 1</option>
              <option value="MTC2">MTC 2</option>
              <option value="UTL">UTL</option>
              <option value="BM">BM</option>
            </select>
          </div>
          <div class="form-control">
            <label class="label"><span class="label-text font-medium">Tanggal Pemakaian <span class="text-error">*</span></span></label>
            <input type="date" name="tanggal_pemakaian" class="input input-bordered input-sm" required/>
          </div>

        </div>
      </div>
    </div>

    <!-- Items -->
    <div class="card bg-base-100 shadow-sm mb-4">
      <div class="card-body">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold text-gray-700 flex items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-primary">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z" />
            </svg>
            Deskripsi Permintaan Barang/Jasa
          </h3>
          <button type="button" @click="addItem()" class="btn btn-outline btn-sm gap-1">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
            Tambah Item
          </button>
        </div>

        <!-- Item rows -->
        <div class="overflow-x-auto">
          <table class="table table-sm w-full">
            <thead>
              <tr class="bg-base-200">
                <th class="w-8 text-center">No</th>
                <th>Deskripsi Barang/Jasa <span class="text-error">*</span></th>
                <th class="w-16 text-center">QTY <span class="text-error">*</span></th>
                <th>Peruntukan <span class="text-error">*</span></th>
                <th>Lampiran</th>
                <th class="w-10"></th>
              </tr>
            </thead>
            <tbody>
              <template x-for="(item, index) in items" :key="index">
                <tr>
                  <td class="text-center font-mono text-gray-500" x-text="index + 1"></td>
                  <td>
                    <input type="text" name="deskripsi[]" class="input input-bordered input-xs w-full"
                           x-model="item.deskripsi" required placeholder="Nama barang atau jasa"/>
                  </td>
                  <td class="w-16">
                    <input type="number" name="qty[]" class="input input-bordered input-xs w-16 text-center"
                           x-model="item.qty" min="1" required placeholder="1"/>
                  </td>
                  <td>
                    <input type="text" name="peruntukan[]" class="input input-bordered input-xs w-full"
                           x-model="item.peruntukan" required placeholder="Untuk keperluan..."/>
                  </td>
                  <td>
                    <input type="text" name="lampiran[]" class="input input-bordered input-xs w-full"
                           x-model="item.lampiran" placeholder="ket. dokumen"/>
                  </td>
                  <td>
                    <button type="button" @click="removeItem(index)"
                            x-show="items.length > 1"
                            class="btn btn-ghost btn-xs text-error">
                      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                      </svg>
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Submit -->
    <div class="flex justify-end gap-3">
      <a href="/non-inventory/permintaan" class="btn btn-ghost btn-sm">Batal</a>
      <button type="submit" class="btn btn-primary btn-sm gap-2" :disabled="submitting">
        <span x-show="submitting" class="loading loading-spinner loading-xs"></span>
        <svg x-show="!submitting" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
        </svg>
        Kirim Permintaan
      </button>
    </div>

  </form>
</div>

<script>
function niForm() {
  return {
    items: [{ deskripsi: '', qty: 1, peruntukan: '', lampiran: '' }],
    submitting: false,
    addItem() {
      this.items.push({ deskripsi: '', qty: 1, peruntukan: '', lampiran: '' });
    },
    removeItem(index) {
      if (this.items.length > 1) this.items.splice(index, 1);
    },
    handleSubmit(e) {
      this.submitting = true;
      e.target.submit();
    }
  }
}
</script>
{{end}}
{{template "base" .}}
