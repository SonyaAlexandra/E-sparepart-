<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Sparepart Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="/static/js/app.js" defer></script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', sans-serif;
    }

    .split {
      display: flex;
      height: 100vh;
    }

    /* Left: photo panel */
    .panel-photo {
      width: 55%;
      position: relative;
      background: url('/static/images/b7.png') center/cover no-repeat;
      flex-shrink: 0;
    }

    .panel-photo::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(11, 45, 89, 0.60) 60%, rgba(8, 30, 60, 0.80) 100%);
    }

    /* Right: form panel */
    .panel-form {
      flex: 1;
      background: #fff;
      border-left: 1px solid rgba(0, 0, 0, 0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-y: auto;
    }

    .form-box {
      width: 100%;
      max-width: 380px;
      padding: 48px 40px;
    }

    .form-box img.logo {
      height: 44px;
      margin-bottom: 6px;
    }

    .system-title {
      font-size: 17px;
      font-weight: 700;
      color: #0B2D59;
      margin-bottom: 4px;
    }

    .system-sub {
      font-size: 12px;
      color: #999;
      margin-bottom: 20px;
    }

    .divider {
      height: 1px;
      background: #eee;
      margin-bottom: 24px;
    }

    /* Error */
    .error-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff4f4;
      border: 1px solid #fcc;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 13px;
      color: #c0392b;
    }

    /* Fields */
    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg.icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #ccc;
      pointer-events: none;
    }

    .input-wrap input {
      width: 100%;
      height: 44px;
      padding: 0 14px 0 38px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #222;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-wrap input::placeholder {
      color: #bbb;
    }

    .input-wrap input:focus {
      border-color: #568C20;
      box-shadow: 0 0 0 3px rgba(86, 140, 32, 0.10);
    }

    .input-wrap input.has-toggle {
      padding-right: 42px;
    }

    .eye-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #bbb;
      display: flex;
    }

    .eye-btn:hover {
      color: #888;
    }

    /* Submit */
    .btn-submit {
      width: 100%;
      height: 46px;
      margin-top: 8px;
      background: #568C20;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .btn-submit:hover {
      background: #4a7a1a;
    }

    .footer {
      margin-top: 28px;
      font-size: 11px;
      color: #ccc;
      text-align: center;
    }

    @media (max-width: 768px) {
      .panel-photo {
        display: none;
      }

      .panel-form {
        border-left: none;
      }
    }
  </style>
</head>

<body>
  <div class="split">

    <!-- Left: photo only -->
    <div class="panel-photo"></div>

    <!-- Right: login form -->
    <div class="panel-form">
      <div class="form-box" x-data="{ show: false }">

        <img class="logo" src="/static/images/logo.png" alt="Bintangtoedjoe" />
        <p class="system-title">Sparepart Management System</p>
        <p class="system-sub">Masuk ke akun Anda untuk melanjutkan</p>
        <div class="divider"></div>

        {{if .Error}}
        <div class="error-box">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
            stroke="currentColor" width="16" height="16">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
          </svg>
          {{.Error}}
        </div>
        {{end}}

        <form method="POST" action="/login">

          <div class="field">
            <label for="f-user">Username</label>
            <div class="input-wrap">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6"
                stroke="currentColor" width="16" height="16">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
              </svg>
              <input id="f-user" type="text" name="username" required placeholder="Masukkan username"
                autocomplete="username" />
            </div>
          </div>

          <div class="field">
            <label for="f-pass">Password</label>
            <div class="input-wrap">
              <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6"
                stroke="currentColor" width="16" height="16">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
              </svg>
              <input id="f-pass" class="has-toggle" :type="show ? 'text' : 'password'" name="password" required
                placeholder="Masukkan password" autocomplete="current-password" />
              <button type="button" class="eye-btn" @click="show = !show">
                <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                  stroke-width="1.6" stroke="currentColor" width="17" height="17">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <svg x-show="show" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6"
                  stroke="currentColor" width="17" height="17">
                  <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-submit">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
              stroke="currentColor" width="16" height="16">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
            </svg>
            Masuk
          </button>

        </form>
        
        <div class="footer">
          © 2026 PT Bintang Toedjoe • Developed by SNYLXNP
        </div>
      </div>
    </div>

  </div>
</body>

</html>
